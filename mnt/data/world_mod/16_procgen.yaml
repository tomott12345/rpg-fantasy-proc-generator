procgen:
  meta:
    version: 10
    world: Etheras
    description: "Procedural generation tables for adventures, settlements, dungeons, factions, and quests in Etheras."

  global:
    density:
      settlements: 0.8
      dungeons: 1.2
      factions: 1.0
    difficulty_baseline: standard
    encounter_frequency: moderate

  dice:
    treasure_tier_by_cr:
      "0-2": poor
      "3-5": standard
      "6-10": rich
      "11+": legendary

  tables:
    - id: region
      entries:
        - weight: 4
          result: { id: ackdon, label: "Ackdon – City of Grace" }
        - weight: 3
          result: { id: sadri_desert, label: "Sadri Desert" }
        - weight: 3
          result: { id: iuned, label: "Iuned Frontier" }
        - weight: 3
          result: { id: dagger_depths, label: "Dagger Depths Great Lake" }
        - weight: 3
          result: { id: glitterhold_forest, label: "Glitterhold Forest" }
        - weight: 2
          result: { id: wraith_fortress, label: "Wraith Baroness Wastes" }

    - id: settlement_type
      entries:
        - weight: 3
          result: { id: village, label: "village" }
        - weight: 3
          result: { id: town, label: "town" }
        - weight: 3
          result: { id: port_city, label: "port city" }
        - weight: 2
          result: { id: fortress, label: "fortress outpost" }

    - id: settlement_problem
      entries:
        - weight: 3
          result: "banditry cutting into caravans"
        - weight: 2
          result: "monster attacks from nearby ruins"
        - weight: 2
          result: "political tension between factions"
        - weight: 1
          result: "strange Cataclysm echoes warping reality"

    - id: dungeon_theme
      entries:
        - weight: 3
          result:
            id: cataclysmic_ruins
            name: "Cataclysmic Ruins"
            tags: [temporal, unstable, relic_rich]
        - weight: 3
          result:
            id: haunted_house
            name: "Haunted Noble House"
            tags: [haunted, noble, relic_cache]
        - weight: 3
          result:
            id: arcane_tower
            name: "Ancient Arcane Tower"
            tags: [arcane, celestial]
        - weight: 2
          result:
            id: deep_labyrinth
            name: "Deep Labyrinth"
            tags: [maze, eldritch]
        - weight: 2
          result:
            id: shattered_fortress
            name: "Shattered Fortress"
            tags: [military, cursed, undead]

    - id: hook_types
      entries:
        - weight: 3
          result:
            type: monster_hunt
            twist: "the monster is sapient and driven by revenge"
        - weight: 3
          result:
            type: escort
            twist: "the escortee hides a Cataclysm relic"
        - weight: 2
          result:
            type: dungeon_delving
            twist: "time flows strangely within the ruin"
        - weight: 2
          result:
            type: investigation
            twist: "multiple factions compete for the same secret"
        - weight: 1
          result:
            type: retrieval
            twist: "the relic corrupts whoever touches it"

    - id: complication
      entries:
        - weight: 3
          result: "A rival faction interferes."
        - weight: 2
          result: "The weather turns deadly at the worst time."
        - weight: 2
          result: "Supplies are running low faster than expected."
        - weight: 1
          result: "An echo of the Cataclysm erupts mid-mission."

  generators:
    settlement:
      steps:
        - table: region
        - table: settlement_type
        - table: settlement_problem
        - output_template: |
            A {{settlement_type.label}} located in {{region.label}}.
            Current Problem: {{settlement_problem}}

    dungeon:
      steps:
        - table: region
        - table: dungeon_theme
        - output_template: |
            {{dungeon_theme.name}} located near {{region.label}}.
            Themes: {{dungeon_theme.tags}}

    quest:
      steps:
        - derive: { cr_guess: 3 }
        - table: region
        - table: hook_types
        - table: complication
        - bind: { reward: treasure_tier_by_cr(cr_guess) }
        - output_template: |
            Quest Type: {{hook.type|title}}
            Region: {{region.label}}
            Twist: {{hook.twist}}
            Complication: {{complication}}
            Reward Tier: {{reward}}

