        - weight: 2
          result: "Political tension between factions."
        - weight: 1
          result: "Strange Cataclysm echoes warping reality."
        - weight: 2
          result: "Drought threatening the harvest."
        - weight: 2
          result: "A poisoned well that no one will explain."
        - weight: 2
          result: "A mercenary company demanding 'protection' fees."
        - weight: 2
          result: "Relic thieves stripping the old temple."
        - weight: 2
          result: "A plague of nightmares haunting the population."
        - weight: 2
          result: "A murder no one will investigate."
        - weight: 2
          result: "Children going missing near the old mill."
        - weight: 2
