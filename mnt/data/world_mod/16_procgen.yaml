    # ── HOOK TYPES ───────────────────────────────────────────────────────────────
    - id: hook_types
      entries:
        - weight: 3
          result:
            type: monster_hunt
            twist: "The monster is sapient and driven by revenge."
        - weight: 3
          result:
            type: escort
            twist: "The escortee is hiding a Cataclysm relic."
        - weight: 2
          result:
            type: dungeon_delving
            twist: "Time flows strangely within the ruin."
        - weight: 2
          result:
            type: investigation
            twist: "Multiple factions compete for the same secret."
        - weight: 1
          result:
            type: retrieval
            twist: "The relic corrupts whoever touches it."
        - weight: 2
          result:
            type: missing_person
            twist: "The missing person doesn't want to be found."
        - weight: 2
          result:
