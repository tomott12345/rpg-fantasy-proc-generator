        - weight: 1
          result:
            type: beast_taming
            twist: "The creature is a transformed person."
        - weight: 1
          result:
            type: frontier_claim
            twist: "The land is already claimed — by the dead."

    # ── COMPLICATION ─────────────────────────────────────────────────────────────
    - id: complication
      entries:
        - weight: 3
          result: "A rival faction interferes."
        - weight: 2
          result: "The weather turns deadly at the worst time."
        - weight: 2
          result: "Supplies are running low faster than expected."
        - weight: 1
          result: "An echo of the Cataclysm erupts mid-mission."
        - weight: 2
          result: "A member of the party is recognized — and not welcome here."
        - weight: 2
          result: "The quest giver goes silent mid-job."
        - weight: 2
          result: "A third faction arrives with their own agenda."
        - weight: 2
          result: "The target has already been moved."
        - weight: 2
          result: "One of the party's contacts has been compromised."
        - weight: 1
          result: "The terrain itself is shifting or corrupted."
        - weight: 1
          result: "A traitor within the group is passing information."
        - weight: 2
          result: "A local law prohibits what the party needs to do."
        - weight: 2
          result: "The mission timer accelerates without warning."
        - weight: 2
          result: "Something the party thought was safe turns out to be dangerous."
        - weight: 2
          result: "A new clue reframes the entire mission."
        - weight: 2
          result: "The enemy knows the party is coming."
        - weight: 2
          result: "An old enemy makes a surprise appearance."
        - weight: 2
          result: "The safe route is no longer safe."
        - weight: 1
          result: "A moral dilemma splits the party's loyalties."
        - weight: 1
          result: "The real threat is revealed to be larger than expected."

    # ── NPC PERSONALITY ──────────────────────────────────────────────────────────
    - id: npc_personality
      entries:
        - weight: 3
          result:
            archetype: gruff_veteran
            motivation: "Protect the people who can't protect themselves."
            speech_quirk: "Speaks in short sentences; never asks twice."
            secret: "Carries guilt from a battle where cowardice got comrades killed."
        - weight: 3
          result:
            archetype: charming_merchant
            motivation: "Accumulate enough wealth to retire in comfort."
            speech_quirk: "Punctuates sentences with exaggerated flattery."
            secret: "Is deeply in debt to a crime lord."
        - weight: 2
          result:
            archetype: nervous_scholar
            motivation: "Prove a dangerous theory before someone else does."
            speech_quirk: "Asks questions instead of making statements."
            secret: "Knows the theory is already proven — and it's terrifying."
        - weight: 2
          result:
            archetype: weary_priest
            motivation: "Maintain faith despite growing doubt."
            speech_quirk: "Quotes scripture awkwardly at odd moments."
            secret: "Has not prayed sincerely in two years."
        - weight: 2
          result:
            archetype: ambitious_noble
            motivation: "Gain power before rivals do."
            speech_quirk: "Uses 'we' to mean 'I'."
            secret: "Is secretly funding a rebellion."
        - weight: 2
          result:
            archetype: bitter_exile
            motivation: "Return to a lost homeland."
            speech_quirk: "Name-drops powerful former connections."
            secret: "Was exiled for a crime they did commit."
        - weight: 2
          result:
            archetype: jovial_rogue
            motivation: "Survive and have fun doing it."
            speech_quirk: "Deflects with jokes under pressure."
            secret: "Is running from a contract placed on their own head."
        - weight: 2
          result:
            archetype: fanatical_cultist
            motivation: "Usher in a new age."
            speech_quirk: "Speaks of outsiders as 'the uninitiated'."
            secret: "Is beginning to doubt the doctrine."
        - weight: 2
          result:
            archetype: haunted_survivor
            motivation: "Forget what they witnessed."
            speech_quirk: "Trails off mid-sentence; stares into the distance."
            secret: "Is being visited by something from the Cataclysm."
        - weight: 2
          result:
            archetype: calculating_spymaster
            motivation: "Control every variable."
            speech_quirk: "Gives only the minimum necessary information."
            secret: "Genuinely cares about one specific person — and it makes them vulnerable."
        - weight: 2
          result:
            archetype: naive_acolyte
            motivation: "Do the right thing, whatever it costs."
            speech_quirk: "Asks clarifying questions about everything."
            secret: "Has never left their hometown before this mission."
        - weight: 2
          result:
            archetype: territorial_ranger
            motivation: "Protect the wilderness from civilization."
            speech_quirk: "Speaks of land as living."
            secret: "Harbors a deep distrust of magic users."
        - weight: 2
          result:
            archetype: obsessed_collector
            motivation: "Complete the collection at any price."
            speech_quirk: "Catalogs everything they see mentally — sometimes aloud."
            secret: "The collection is cursed."
        - weight: 2
          result:
            archetype: grieving_parent
            motivation: "Find closure or revenge."
            speech_quirk: "Shows an old portrait of a lost child often."
            secret: "The child is not dead."
        - weight: 2
          result:
            archetype: court_jester
            motivation: "Survive through laughter."
            speech_quirk: "Never breaks character, even under threat."
            secret: "Carries information that could topple the local government."
        - weight: 2
          result:
            archetype: retired_assassin
            motivation: "Live quietly and disturb no one."
            speech_quirk: "Overly aware of exits and sightlines."
            secret: "The last job was never truly finished."
        - weight: 2
          result:
            archetype: wandering_herbalist
            motivation: "Heal and move on."
            speech_quirk: "Offers food and remedies unprompted."
            secret: "Is tracking a specific plague from the inside."
        - weight: 2
          result:
            archetype: disgraced_soldier
            motivation: "Earn back honor."
            speech_quirk: "Takes any mission without question."
            secret: "Disobeying the order that disgraced them would have been right."
        - weight: 1
          result:
            archetype: curious_construct
            motivation: "Understand what emotions are."
            speech_quirk: "Interprets idioms literally."
            secret: "Was built to do something they are now refusing to do."
        - weight: 2
          result:
            archetype: sea_captain_turned_landlocked
            motivation: "Return to the sea."
            speech_quirk: "Uses excessive nautical metaphors."
            secret: "Their ship sank because of their fault, not the weather."

    # ── RUMOR ────────────────────────────────────────────────────────────────────
    - id: rumor
      entries:
        - weight: 3
          result:
            text: "The blacksmith hasn't slept in three weeks — says something visits at midnight."
            accurate: false
        - weight: 3
          result:
            text: "A Cataclysm relic was dug up and sold before anyone could identify it."
            accurate: true
        - weight: 3
          result:
            text: "The lord's personal guard has been doubled. Something spooked him."
            accurate: true
        - weight: 3
          result:
            text: "There are tunnels under the old market that connect to the harbor."
            accurate: true
        - weight: 2
          result:
            text: "The river runs red three nights before a disaster. It ran red last night."
            accurate: false
        - weight: 2
          result:
            text: "A traveler left behind a coin no one could identify. It wasn't from any mint on this continent."
            accurate: true
        - weight: 2
          result:
            text: "The old healer refuses to treat Cataclysm wounds. Says she's seen what comes after."
            accurate: true
        - weight: 3
          result:
            text: "There's a bounty out on someone in this town — no one knows who placed it."
            accurate: true
        - weight: 2
          result:
            text: "The new priest at the temple has no shadow."
            accurate: false
        - weight: 2
          result:
            text: "The innkeeper keeps a ledger of everyone who passes through. Someone is paying for that information."
            accurate: true
        - weight: 2
          result:
            text: "Three caravans disappeared on the southern pass last month. The third sent back a warning: 'Don't come after us.'"
            accurate: true
        - weight: 2
          result:
            text: "A child drew a detailed map of the dungeon ruins — she'd never been there."
            accurate: false
        - weight: 2
          result:
            text: "People who drink from the town well dream the same dream."
            accurate: true
        - weight: 2
          result:
            text: "The faction representative in town is not who they claim to be."
            accurate: true
        - weight: 2
          result:
            text: "Someone is buying up every ward-stone in the region. No one knows why."
            accurate: true
        - weight: 2
          result:
            text: "A merchant sold a 'lucky charm' that brings misfortune to those around the owner, not the holder."
            accurate: true
        - weight: 3
          result:
            text: "The forest has been completely quiet for a week. Not even birds."
            accurate: true
        - weight: 1
          result:
            text: "A man walked into the tavern, ordered nothing, sat for an hour, then left. He had no face."
            accurate: false
        - weight: 2
          result:
            text: "There's a second entrance to the ruins that the faction doesn't know about."
            accurate: true
        - weight: 1
          result:
            text: "The stars looked wrong last night — like they'd moved."
            accurate: true

    # ── MYSTERY CLUE ─────────────────────────────────────────────────────────────
    - id: mystery_clue
      entries:
        - weight: 3
          result:
            type: physical
            clue: "A fresh bootprint in the dust — far too large for a human."
            implication: "Something large was here recently."
        - weight: 3
          result:
            type: testimonial
            clue: "A dockworker swears he saw someone enter the warehouse — but no one left."
            implication: "There is a hidden exit or a means of teleportation."
        - weight: 2
          result:
            type: magical
            clue: "A zone of magical silence — no spell will function here."
            implication: "Deliberate warding or Cataclysm relic residue."
        - weight: 2
          result:
            type: documentary
            clue: "A ledger page torn out, but the impression remains in the next page."
            implication: "Financial records someone didn't want found."
        - weight: 2
          result:
            type: physical
            clue: "Claw marks on the stone wall, starting at shoulder height."
            implication: "The creature was on the ceiling."
        - weight: 2
          result:
            type: testimonial
            clue: "Two witnesses describe the same stranger, one day apart, fifty miles away."
            implication: "Fast travel or two people impersonating one."
        - weight: 2
          result:
            type: magical
            clue: "The candle flame bends toward the sealed door every hour on the hour."
            implication: "Something is breathing behind it."
        - weight: 2
          result:
            type: documentary
            clue: "A letter referencing a meeting that no one admits to attending."
            implication: "A secret coalition is forming."
        - weight: 2
          result:
            type: physical
            clue: "Sand in the footwear of everyone who arrived from the northern road."
            implication: "They came from the desert, not the north."
        - weight: 2
          result:
            type: testimonial
            clue: "The survivor refuses to look anyone in the eye since returning from the ruins."
            implication: "Saw something that is still watching."
        - weight: 2
          result:
            type: magical
            clue: "Arcane residue that suggests dimensional travel — or arrival from outside this plane."
            implication: "Extraplanar involvement."
        - weight: 2
          result:
            type: documentary
            clue: "A map with one building marked in different ink — added later, hastily."
            implication: "Someone updated the map after the fact."
        - weight: 2
          result:
            type: physical
            clue: "A blood smear at waist height on the wall, but the floor beneath is clean."
            implication: "The body was moved after the fact."
        - weight: 2
          result:
            type: testimonial
            clue: "The child says the bad man smelled like rain and smoke. It hasn't rained in a month."
            implication: "Cataclysm echo or dimensional traveler."
        - weight: 2
          result:
            type: magical
            clue: "A holy symbol that melted — not from heat, but from something else entirely."
            implication: "Presence of infernal power."
        - weight: 2
          result:
            type: documentary
            clue: "A deed of property signed by someone who died fifteen years ago."
            implication: "Forgery or undead."
        - weight: 2
          result:
            type: physical
            clue: "Ash circles drawn on the floor in three rooms. All point toward the east wall."
            implication: "Summoning circle alignment."
        - weight: 2
          result:
            type: testimonial
            clue: "An elderly merchant remembers this exact sequence of events happening thirty years ago."
            implication: "A cyclical Cataclysm pattern."
        - weight: 2
          result:
            type: magical
            clue: "Objects in the room are slightly out of phase — pass through them like fog, then solidify."
            implication: "Temporal instability."
        - weight: 2
          result:
            type: documentary
            clue: "A name crossed out in three separate documents — all written by different hands."
            implication: "Someone is being systematically erased."

    # ── WEATHER EVENT ────────────────────────────────────────────────────────────
    - id: weather_event
      entries:
        - weight: 3
          result:
            name: "Ashfall"
            description: "Grey ash drifts from a clear sky. Smells of old fire."
            mechanical_effect: "Perception (sight) checks at disadvantage; tracks fill in within 1 hour."
        - weight: 2
          result:
            name: "Ley Storm"
            description: "Arcing purple lightning leaps between metal objects."
            mechanical_effect: "Random magical effects each round; metal armor gives disadvantage on Stealth."
        - weight: 2
          result:
            name: "Blood Fog"
            description: "A crimson mist rolls in at dawn."
            mechanical_effect: "Visibility 30 ft; DC 13 Wis or frightened for 1 minute."
        - weight: 2
          result:
            name: "Sunless Day"
            description: "The sun simply doesn't rise. Not overcast — absent."
            mechanical_effect: "Undead ignore sunlight until next dawn; darkvision extended 30 ft."
        - weight: 3
          result:
            name: "Still Air"
            description: "Not even a whisper of wind."
            mechanical_effect: "Advantage on Perception (sound); impossible to hide scent."
        - weight: 2
          result:
            name: "Black Rain"
            description: "Rain that leaves dark stains and tastes of iron."
            mechanical_effect: "Extinguishes all nonmagical fire; DC 12 Con or poisoned 1 hour."
        - weight: 2
          result:
            name: "Desert Haboob"
            description: "A wall of sand 200 feet tall rolling in from the south."
            mechanical_effect: "Sadri/Iuned only; total obscurement; shelter or gain 1d4 exhaustion."
        - weight: 2
          result:
            name: "Glitterhold Bloom"
            description: "The forest exhales luminescent spores at dusk."
            mechanical_effect: "Forest only; beasts become friendly 1d4 hours; darkvision unreliable."
        - weight: 2
          result:
            name: "Lake Surge"
            description: "Dagger Depths suddenly rises five feet."
            mechanical_effect: "Dagger Depths only; shoreline routes flooded; swimming DC +4."
        - weight: 1
          result:
            name: "Cataclysm Tremor"
            description: "The ground pulses once, slowly, like a heartbeat."
            mechanical_effect: "All Concentration saves DC 12 for next hour; Cataclysm relics vibrate faintly."
        - weight: 2
          result:
            name: "Frost Snap"
            description: "Temperature drops 40 degrees in under an hour."
            mechanical_effect: "Exhaustion track begins for unprotected characters; water sources freeze."
        - weight: 2
          result:
            name: "Scorching Wind"
            description: "Hot dry wind strips moisture from everything."
            mechanical_effect: "Sadri/Iuned; water rations halved; disadvantage on Con saves vs exhaustion."
        - weight: 2
          result:
            name: "Thunderhead"
            description: "A storm that pauses — then hits all at once."
            mechanical_effect: "Characters in the open take 1d4 lightning (DC 13 Dex negates); lasts 2 hours."
        - weight: 2
          result:
            name: "Crimson Aurora"
            description: "Northern lights, red, visible even at noon."
            mechanical_effect: "Wraith Fortress region; undead act with unusual purpose; diviners get visions."
        - weight: 2
          result:
            name: "Tide of Voices"
            description: "A sound like distant chanting that no one can locate."
            mechanical_effect: "Perception at disadvantage; Insight at advantage."
        - weight: 2
          result:
            name: "Pilgrim Wind"
            description: "A warm wind that carries the smell of incense."
            mechanical_effect: "Church holy day: healing spells restore +1d4; sacred sites glow."
        - weight: 2
          result:
            name: "Mirror Ice"
            description: "A thin layer of ice that shows reflections of other places."
            mechanical_effect: "Glitterhold/Dagger Depths; reflections show the past."
        - weight: 2
          result:
            name: "Starfall"
            description: "A cascade of small meteors, none harmful."
