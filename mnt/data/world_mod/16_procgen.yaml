  generators:
    settlement:
      steps:
        - table: region
        - table: settlement_type
        - table: settlement_problem
        - output_template: |
            A {{settlement_type.label}} located in {{region.label}}.
            Current Problem: {{settlement_problem}}

    dungeon:
      steps:
        - table: region
        - table: dungeon_theme
        - output_template: |
            {{dungeon_theme.name}} located near {{region.label}}.
            Themes: {{dungeon_theme.tags}}

    quest:
      steps:
        - derive: { cr_guess: 3 }
        - table: region
        - table: hook_types
        - table: complication
        - bind: { reward: treasure_tier_by_cr(cr_guess) }
        - output_template: |
            Quest Type: {{hook.type|title}}
            Region: {{region.label}}
            Twist: {{hook.twist}}
            Complication: {{complication}}
            Reward Tier: {{reward}}

    one_shot:
      steps:
        - table: region
        - table: hook_types
        - table: complication
        - table: settlement_type
        - table: settlement_problem
        - table: dungeon_theme
        - table: npc_personality
        - table: rumor
        - table: weather_event
        - table: encounter_mix
        - table: magic_item_quirk
        - table: mystery_clue
        - bind: { reward: treasure_tier_by_cr(cr_guess) }

    session_zero:
      steps:
        - table: region
        - table: hook_types
        - table: dungeon_theme
        - table: npc_personality
        - table: rumor
        - output_template: |
            # Session Zero Pitch
            **Region:** {{region.label}}
            **Quest Hook:** {{hook.type|title}} — {{hook.twist}}
            **Location:** {{dungeon_theme.name}} ({{dungeon_theme.tags}})
            **Quest Giver Archetype:** {{npc.archetype}} — {{npc.motivation}}
            **Opening Rumor:** {{rumor.text}}
